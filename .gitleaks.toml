[extend]
useDefault = true

[[allowlists]]
description = "Generated secret-free Docker DNS URLs whose api-1 container names trigger the generic API-key rule"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''^\s*private_url: http://(?:kyqra-crawler-api-1:3000|telnexa-saas-billing-api-1:8000)/[A-Za-z0-9_./{}-]+$''',
]
