name: Retry final staging read-only controller v2 integration

on:
  push:
    branches:
      - release/staging-readonly-production-canary-20260903
    paths:
      - .github/workflows/retry-finalize-staging-readonly-v2.yml

permissions:
  contents: write

concurrency:
  group: finalize-staging-readonly-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply final integration and run all regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 operations/staging-readonly/finalize_v2.py
          python3 - <<'PY'
          from pathlib import Path

          legacy = Path("operations/staging-readonly/test_release_control.py")
          source = legacy.read_text(encoding="utf-8")
          if "import sys\n" not in source:
              source = source.replace(
                  "import os\nfrom pathlib import Path\n",
                  "import os\nimport sys\nfrom pathlib import Path\n",
                  1,
              )
          if "sys.modules[SPEC.name] = release_control" not in source:
              source = source.replace(
                  "release_control = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(release_control)\n",
                  "release_control = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = release_control\nSPEC.loader.exec_module(release_control)\n",
                  1,
              )
          legacy.write_text(source, encoding="utf-8")

          path = Path("operations/staging-readonly/test_release_control_v2.py")
          tests = path.read_text(encoding="utf-8")
          tests = tests.replace(
              "        release.validate_staging_evidence(evidence, candidate, digest)\n",
              "        release.validate_run_evidence(\n"
              "            evidence, candidate, digest,\n"
              "            expected_mode=\"staging\",\n"
              "            environment_prefix=\"STAGING\",\n"
              "            required_gates={\"all\"},\n"
              "        )\n",
              1,
          )
          tests = tests.replace(
              "            release.validate_staging_evidence, evidence, candidate, digest\n",
              "            release.validate_run_evidence, evidence, candidate, digest,\n"
              "            expected_mode=\"staging\",\n"
              "            environment_prefix=\"STAGING\",\n"
              "            required_gates={\"all\"},\n",
              1,
          )
          if "validate_staging_evidence" in tests:
              raise SystemExit("stale staging-evidence helper remains in tests")
          path.write_text(tests, encoding="utf-8")
          PY
          git add -A
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-staging-readonly-source.yml \
            .github/workflows/finalize-staging-readonly-v2.yml \
            .github/workflows/retry-finalize-staging-readonly-v2.yml \
            operations/staging-readonly/finalize_v2.py
          python3 -m py_compile \
            operations/staging-readonly/release_control.py \
            operations/staging-readonly/release_control_v2.py \
            operations/staging-readonly/release_control_entry.py \
            operations/staging-readonly/test_release_control.py \
            operations/staging-readonly/test_release_control_v2.py
          python3 operations/staging-readonly/test_release_control.py
          python3 operations/staging-readonly/test_release_control_v2.py
          for path in \
            operations/staging-readonly/release-control.schema.json \
            operations/staging-readonly/staging-endpoints.schema.json \
            operations/staging-readonly/release-control.template.json \
            operations/staging-readonly/staging-endpoints.template.json \
            operations/staging-readonly/production-endpoints.template.json; do
            python3 -m json.tool "$path" >/dev/null
          done
          git diff --check
          git commit -m "fix(release): bind targets, digests, recovery, and prerequisite evidence"
          git push origin HEAD:release/staging-readonly-production-canary-20260903
