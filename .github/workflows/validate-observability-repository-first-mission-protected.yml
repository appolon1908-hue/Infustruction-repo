name: Validate protected observability repository-first mission

on:
  push:
    branches: [main]
    paths:
      - CODESTRA_OBSERVABILITY_REPO_FIRST_CODEX_MISSION_2026-09-02.md
      - scripts/validate_observability_repository_first_mission.py
      - tests/test_observability_repository_first_mission.py
      - .github/workflows/validate-observability-repository-first-mission.yml
      - .github/workflows/validate-observability-repository-first-mission-protected.yml

permissions:
  contents: read

jobs:
  validate-mission-protected:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python3 scripts/validate_observability_repository_first_mission.py
      - run: python3 -m unittest discover -s tests -p 'test_observability_repository_first_mission.py'
