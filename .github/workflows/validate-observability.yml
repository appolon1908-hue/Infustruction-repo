name: Validate observability integration contract

on:
  pull_request:
    paths:
      - '.github/workflows/validate-observability.yml'
      - 'docs/NETWORKING.md'
      - 'docs/OBSERVABILITY.md'
      - 'docs/SECURITY-BASELINE.md'
      - 'observability/**'
      - 'schemas/observability-integration-manifest.schema.json'
      - 'scripts/validate-observability-manifest.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-observability.yml'
      - 'docs/NETWORKING.md'
      - 'docs/OBSERVABILITY.md'
      - 'docs/SECURITY-BASELINE.md'
      - 'observability/**'
      - 'schemas/observability-integration-manifest.schema.json'
      - 'scripts/validate-observability-manifest.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate fail-closed observability manifest
        run: node scripts/validate-observability-manifest.mjs
