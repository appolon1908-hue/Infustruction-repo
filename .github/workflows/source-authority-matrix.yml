name: source-authority-matrix

on:
  pull_request:
    paths:
      - PRODUCTION-SOURCE-AUTHORITY-MATRIX.yaml
      - scripts/validate_production_source_authority_matrix.py
      - .github/workflows/source-authority-matrix.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-source-authority-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python3 scripts/validate_production_source_authority_matrix.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

