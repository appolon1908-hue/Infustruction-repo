name: Finalize staging read-only controller source

on:
  push:
    branches:
      - release/staging-readonly-production-canary-20260903
    paths:
      - .github/workflows/finalize-staging-readonly-source.yml

permissions:
  contents: write

concurrency:
  group: finalize-staging-readonly-source
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Correct dynamic test import and validate permanent source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("operations/staging-readonly/test_release_control.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "import os\nfrom pathlib import Path\n",
              "import os\nimport sys\nfrom pathlib import Path\n",
              1,
          )
          source = source.replace(
              "release_control = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(release_control)\n",
              "release_control = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = release_control\nSPEC.loader.exec_module(release_control)\n",
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY
          python3 -m py_compile \
            operations/staging-readonly/release_control.py \
            operations/staging-readonly/release_control_entry.py \
            operations/staging-readonly/test_release_control.py
          python3 operations/staging-readonly/test_release_control.py
          python3 -m json.tool operations/staging-readonly/release-control.schema.json >/dev/null
          python3 -m json.tool operations/staging-readonly/staging-endpoints.schema.json >/dev/null
          python3 -m json.tool operations/staging-readonly/release-control.template.json >/dev/null
          python3 -m json.tool operations/staging-readonly/staging-endpoints.template.json >/dev/null
          git diff --check
          git add operations/staging-readonly/test_release_control.py
          git rm .github/workflows/finalize-staging-readonly-source.yml
          git commit -m "test(release): finalize immutable release controller"
          git push origin HEAD:release/staging-readonly-production-canary-20260903
