name: Finalize staging read-only controller v2

on:
  push:
    branches:
      - release/staging-readonly-production-canary-20260903
    paths:
      - .github/workflows/finalize-staging-readonly-v2.yml

permissions:
  contents: write

concurrency:
  group: finalize-staging-readonly-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply v2 integration and validate permanent source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 operations/staging-readonly/finalize_v2.py
          git add -A
          git rm \
            .github/workflows/finalize-staging-readonly-v2.yml \
            operations/staging-readonly/finalize_v2.py
          python3 -m py_compile \
            operations/staging-readonly/release_control.py \
            operations/staging-readonly/release_control_v2.py \
            operations/staging-readonly/release_control_entry.py \
            operations/staging-readonly/test_release_control.py \
            operations/staging-readonly/test_release_control_v2.py
          python3 operations/staging-readonly/test_release_control.py
          python3 operations/staging-readonly/test_release_control_v2.py
          python3 -m json.tool operations/staging-readonly/release-control.schema.json >/dev/null
          python3 -m json.tool operations/staging-readonly/staging-endpoints.schema.json >/dev/null
          python3 -m json.tool operations/staging-readonly/release-control.template.json >/dev/null
          python3 -m json.tool operations/staging-readonly/staging-endpoints.template.json >/dev/null
          python3 -m json.tool operations/staging-readonly/production-endpoints.template.json >/dev/null
          git diff --check
          git commit -m "fix(release): bind targets, digests, recovery, and prerequisite evidence"
          git push origin HEAD:release/staging-readonly-production-canary-20260903
