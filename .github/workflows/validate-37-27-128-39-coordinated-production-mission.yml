name: Validate 37.27.128.39 coordinated production mission

on:
  pull_request:
    paths:
      - "missions/CODESTRA_37_27_128_39_COORDINATED_PRODUCTION_LIVE_CODEX_MISSION_2026-09-02.md"
      - "scripts/validate_37_27_128_39_coordinated_mission.py"
      - ".github/workflows/validate-37-27-128-39-coordinated-production-mission.yml"
  push:
    branches:
      - main
      - development
      - test
      - staging
      - production
    paths:
      - "missions/CODESTRA_37_27_128_39_COORDINATED_PRODUCTION_LIVE_CODEX_MISSION_2026-09-02.md"
      - "scripts/validate_37_27_128_39_coordinated_mission.py"
      - ".github/workflows/validate-37-27-128-39-coordinated-production-mission.yml"

permissions:
  contents: read

concurrency:
  group: coordinated-production-mission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mission:
    name: validate-coordinated-production-mission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          printf 'VALIDATED_SOURCE_SHA=%s\n' "$EXPECTED_SHA"

      - name: Validate mission contract
        run: python3 scripts/validate_37_27_128_39_coordinated_mission.py

      - name: Preserve repository-only boundary
        run: |
          set -euo pipefail
          echo 'TARGET_HOST=37.27.128.39'
          echo 'SERVER_CHANGED=NO'
          echo 'SSH_CONFIGURATION_CHANGED=NO'
          echo 'EMAILS_SENT=0'
          echo 'BYPASS_USED=NONE'
