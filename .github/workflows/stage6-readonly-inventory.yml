name: Stage 6 protected read-only Hetzner inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: stage6-infrastructure-provisioning
    steps:
      - name: Check out exact protected main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove protected main authority
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Require protected bindings without printing values
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_CLOUD_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ vars.TF_STATE_ENDPOINT }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          set -Eeuo pipefail
          test -n "$HCLOUD_TOKEN"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_ENDPOINT"
          test -n "$TF_STATE_REGION"
      - name: Capture sanitized read-only inventory
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_CLOUD_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          api=https://api.hetzner.cloud/v1
          auth="Authorization: Bearer $HCLOUD_TOKEN"
          curl --fail --silent --show-error -H "$auth" "$api/servers?per_page=50" > /tmp/servers.raw.json
          curl --fail --silent --show-error -H "$auth" "$api/networks?per_page=50" > /tmp/networks.raw.json
          curl --fail --silent --show-error -H "$auth" "$api/ssh_keys?per_page=50" > /tmp/ssh_keys.raw.json
          curl --fail --silent --show-error -H "$auth" "$api/locations?per_page=50" > /tmp/locations.raw.json
          jq -n \
            --slurpfile servers /tmp/servers.raw.json \
            --slurpfile networks /tmp/networks.raw.json \
            --slurpfile ssh_keys /tmp/ssh_keys.raw.json \
            --slurpfile locations /tmp/locations.raw.json \
            --arg source_sha "$GITHUB_SHA" \
            '{
              source_sha: $source_sha,
              servers: [$servers[0].servers[] | {
                id, name, status,
                location: .datacenter.location.name,
                public_ipv4: .public_net.ipv4.ip,
                private_net: [.private_net[] | {network, ip}]
              }],
              networks: [$networks[0].networks[] | {
                id, name, ip_range, labels, subnets, routes,
                server_ids: .servers
              }],
              ssh_keys: [$ssh_keys[0].ssh_keys[] | {id, name, fingerprint, labels}],
              locations: [$locations[0].locations[] | {id, name, city, country, network_zone}]
            }' > /tmp/stage6-hetzner-inventory.json
          jq -e '
            (.servers | type == "array") and
            (.networks | type == "array") and
            (.ssh_keys | type == "array") and
            (.locations | type == "array")
          ' /tmp/stage6-hetzner-inventory.json >/dev/null
          rm -f /tmp/*.raw.json
      - name: Upload sanitized inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage6-hetzner-readonly-inventory-${{ github.sha }}
          path: /tmp/stage6-hetzner-inventory.json
          if-no-files-found: error
          retention-days: 1
