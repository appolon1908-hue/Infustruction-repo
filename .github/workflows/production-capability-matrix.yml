name: production-capability-matrix

on:
  pull_request:
    paths:
      - PRODUCTION-SAFETY-CAPABILITY-MATRIX.yaml
      - PRODUCTION-WORKLOAD-INVENTORY-20260901.txt
      - scripts/validate_production_capability_matrix.py
      - .github/workflows/production-capability-matrix.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-production-capability-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pyyaml
      - run: python3 scripts/validate_production_capability_matrix.py
      - name: Scan complete source tree for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --exit-code 1
