name: validate-observability-host-37

on:
  pull_request:
    paths:
      - "deploy/hosts/37.27.128.39/observability/**"
      - ".github/workflows/validate-observability-host-37.yml"
  push:
    branches:
      - main
    paths:
      - "deploy/hosts/37.27.128.39/observability/**"
      - ".github/workflows/validate-observability-host-37.yml"

permissions:
  contents: read

concurrency:
  group: validate-observability-host-37-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-observability-host-37:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            PyYAML==6.0.2 \
            pytest==8.3.5

      - name: Validate repository bundle
        run: |
          ROOT=deploy/hosts/37.27.128.39/observability
          python "$ROOT/scripts/validate_bundle.py" --source
          python -m py_compile \
            "$ROOT/scripts/validate_bundle.py" \
            "$ROOT/config/superset/superset_config.py"
          bash -n "$ROOT/scripts/"*.sh
          pytest -q "$ROOT/tests"

      - name: Render Compose with synthetic immutable inputs
        run: |
          ROOT=deploy/hosts/37.27.128.39/observability
          cp "$ROOT/env/production.env.example" /tmp/production.env
          sed -i \
            's/REPLACE_WITH_64_LOWERCASE_HEX_DIGEST/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/g' \
            /tmp/production.env
          sed -i \
            "s#^OBSERVABILITY_ROOT=.*#OBSERVABILITY_ROOT=$GITHUB_WORKSPACE/$ROOT#" \
            /tmp/production.env
          sed -i \
            's#^OBSERVABILITY_SECRETS_DIR=.*#OBSERVABILITY_SECRETS_DIR=/tmp/codestra-observability-secrets#' \
            /tmp/production.env
          docker compose \
            --env-file /tmp/production.env \
            -f "$ROOT/compose/production-observability.yaml" \
            config --quiet
          docker compose \
            --env-file /tmp/production.env \
            -f "$ROOT/compose/production-observability.yaml" \
            config > /tmp/rendered.yaml
          python - <<'PY'
          import yaml
          document = yaml.safe_load(open("/tmp/rendered.yaml", encoding="utf-8"))
          assert all("ports" not in service for service in document["services"].values())
          assert all(
              "@sha256:" in service["image"]
              for service in document["services"].values()
              if "image" in service
          )
          assert all(
              not service.get("privileged", False)
              for service in document["services"].values()
          )
          print("COMPOSE_SOURCE_RENDER=PASS")
          PY

      - name: Check for embedded private material
        run: |
          ROOT=deploy/hosts/37.27.128.39/observability
          ! grep -RInE \
            --exclude='validate_bundle.py' --exclude-dir='tests' \
            -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|smtp_auth_password:|client_secret[[:space:]]*[:=][[:space:]]*["'"'][A-Za-z0-9+/=_-]{16,}' \
            "$ROOT"
