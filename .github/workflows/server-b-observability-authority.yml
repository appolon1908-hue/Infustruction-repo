name: Server B observability authority

on:
  pull_request:
    paths:
      - "hosts/37.27.128.39/observability/**"
      - ".github/workflows/server-b-observability-authority.yml"
  push:
    branches: [development, test, staging, production, main]
    paths:
      - "hosts/37.27.128.39/observability/**"
      - ".github/workflows/server-b-observability-authority.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Reproduce evidence
        run: python3 hosts/37.27.128.39/observability/generate_evidence.py
      - name: Reject generated drift
        run: git diff --exit-code -- hosts/37.27.128.39/observability
      - name: Validate fail-closed authority
        run: python3 hosts/37.27.128.39/observability/validate.py
      - name: Validate with Python assertions disabled
        run: python3 -O hosts/37.27.128.39/observability/validate.py
