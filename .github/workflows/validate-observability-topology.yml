name: Validate observability topology

on:
  pull_request:
    paths:
      - config/observability/**
      - scripts/validate-observability-topology.py
      - scripts/smoke-observability-edge.sh
      - docs/**
      - .github/workflows/validate-observability-topology.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate desired state
        run: python3 scripts/validate-observability-topology.py

      - name: Shell syntax
        run: bash -n scripts/smoke-observability-edge.sh
