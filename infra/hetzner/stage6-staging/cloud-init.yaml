#cloud-config
hostname: codestra-stage6-staging-01
manage_etc_hosts: true
ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages:
  - apparmor
  - apparmor-utils
  - ca-certificates
  - curl
  - docker-compose-v2
  - docker.io
  - git
  - jq
  - libseccomp2
  - runc
  - unattended-upgrades
users:
  - default
  - name: codestra-stage6-deploy
    gecos: Codestra Stage 6 deployment identity
    groups: []
    shell: /bin/bash
    lock_passwd: true
  - name: codestra-stage6-admin
    gecos: Codestra Stage 6 host operator
    groups: [adm]
    shell: /bin/bash
    lock_passwd: true
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
write_files:
  - path: /etc/ssh/sshd_config.d/60-codestra-stage6.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      AllowUsers codestra-stage6-deploy codestra-stage6-admin
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    content: |
      {
        "icc": false,
        "live-restore": true,
        "log-driver": "local",
        "no-new-privileges": true,
        "userland-proxy": false
      }
  - path: /etc/sysctl.d/60-codestra-stage6.conf
    owner: root:root
    permissions: "0644"
    content: |
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.ip_forward = 1
      kernel.unprivileged_bpf_disabled = 1
  - path: /etc/systemd/system/docker.socket.d/deny-public.conf
    owner: root:root
    permissions: "0644"
    content: |
      [Socket]
      ListenStream=
      ListenStream=/run/docker.sock
      SocketMode=0660
runcmd:
  - [install, -d, -m, "0755", /srv/codestra, /srv/codestra/releases, /srv/codestra/state]
  - [install, -d, -m, "0700", -o, codestra-stage6-deploy, -g, codestra-stage6-deploy, /home/codestra-stage6-deploy/.ssh]
  - [install, -d, -m, "0700", -o, codestra-stage6-admin, -g, codestra-stage6-admin, /home/codestra-stage6-admin/.ssh]
  - [cp, /root/.ssh/authorized_keys, /home/codestra-stage6-deploy/.ssh/authorized_keys]
  - [cp, /root/.ssh/authorized_keys, /home/codestra-stage6-admin/.ssh/authorized_keys]
  - [chown, "codestra-stage6-deploy:codestra-stage6-deploy", /home/codestra-stage6-deploy/.ssh/authorized_keys]
  - [chown, "codestra-stage6-admin:codestra-stage6-admin", /home/codestra-stage6-admin/.ssh/authorized_keys]
  - [chmod, "0600", /home/codestra-stage6-deploy/.ssh/authorized_keys]
  - [chmod, "0600", /home/codestra-stage6-admin/.ssh/authorized_keys]
  - [apt-mark, hold, docker.io, containerd, runc, libseccomp2]
  - [sysctl, --system]
  - [systemctl, daemon-reload]
  - [systemctl, restart, ssh]
  - [systemctl, enable, --now, docker]
  - [sh, -c, "test ! -S /home/codestra-stage6-deploy/docker.sock && test ! -S /home/codestra-stage6-admin/docker.sock"]
final_message: "Codestra Stage 6 base host prepared; applications remain undeployed."
